# Shared settings for both halves.
#
# Display support comes from the nice_view shield in build.yaml:
#   shield: corne_left nice_view_adapter nice_view
#   shield: corne_right nice_view_adapter nice_view
#
# The left half keeps nice!view's custom status widget (battery, WPM,
# Bluetooth profiles, layer).  The right half replaces it with the rubber
# duck screen; see config/corne_right.conf.

# --- Bluetooth / stale-bond repair --------------------------------------
# Zephyr 3.5 refuses to overwrite an existing *unauthenticated* (Just Works)
# bond with a fresh pairing unless this is enabled.  The host sees that as
# SMP reason 0x03 ("Authentication requirements") and BlueZ reports
# "org.bluez.Error.AuthenticationFailed", so a keyboard that still holds an
# old bond cannot be re-paired without wiping settings.  Enabling this lets
# the keyboard repair over the stale bond instead.
#
# Security note: this also lets a peer that spoofs the host's address replace
# the bond.  It is the documented way to allow re-pairing without an explicit
# `bt_unpair`.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# When a bond for the same peer exists under a different local identity
# (e.g. another ZMK Bluetooth profile), delete that old bond before bonding
# instead of failing with the same "Authentication requirements" error.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
