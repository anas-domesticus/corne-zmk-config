# This file generates the GitHub Actions build matrix.
# Board = the microcontroller, shield = the keyboard half.
#
#   nice_nano_v2 = nice!nano v2 (nRF52840)
#   corne_left   = left half  (this is the "central" half that talks to your PC)
#   corne_right  = right half (wireless peripheral)
#
# settings_reset is a special image used to wipe Bluetooth pairing/bonding on a
# half when the two halves refuse to talk to each other.
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano_v2
    shield: settings_reset
